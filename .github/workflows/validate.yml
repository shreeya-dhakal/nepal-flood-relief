name: Validate data

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No dependencies on purpose: a contributor should be able to run the
      # same check locally with nothing but node installed.
      - run: node scripts/validate.mjs
